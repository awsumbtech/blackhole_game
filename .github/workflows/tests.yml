name: tests

on:
  pull_request:
  push:

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright-core playwright && npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          echo $! > /tmp/bh-test-server.pid
          sleep 1
      - name: Run passing tests
        run: |
          set -euo pipefail
          export PLAYWRIGHT_CORE="$PWD/node_modules/playwright-core"
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          echo "Chrome: $CHROME_PATH"
          node tools/v981-cues.cjs 8765
          node tools/oo-manifest.cjs 8765
          node tools/oo-ship.cjs 8765
          node tools/v973-tails.cjs 8765
          node tools/v972-tails.cjs 8765
          node tools/v97-review.cjs 8765
          node tools/v990-resilience.cjs 8765
          node tools/v910-g2-art.cjs 8765
          node tools/v911-g7-forge.cjs 8765
          node tools/v912-g1-g4-art.cjs 8765
          node tools/v913-g6-meadow.cjs 8765
          node tools/v914-g5-aurora.cjs 8765
          node tools/v915-comet-trails.cjs 8765
          node tools/v9160-growth-step.cjs 8765
          node tools/v9151-loop-friction.cjs 8765
          # v97-qa skips cleanly when its audit scripts are absent.
          node tools/v97-qa.cjs 8765 8765
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/bh-test-server.pid)" 2>/dev/null || true
